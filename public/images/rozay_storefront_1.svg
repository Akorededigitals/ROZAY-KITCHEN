<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="redHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="goldChafe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="skyCeiling" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Store Exterior Wall -->
  <rect width="1000" height="1200" fill="#0f172a"/>

  <!-- Top Red Store Sign Board -->
  <rect x="20" y="20" width="960" height="160" fill="url(#redHeader)" rx="8"/>
  <rect x="30" y="30" width="940" height="140" fill="none" stroke="#fef08a" stroke-width="3" rx="6"/>

  <text x="500" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
    ROZAY SUPER CHEF VENTURES
  </text>
  <text x="500" y="115" text-anchor="middle" font-family="monospace" font-weight="800" font-size="20" fill="#fef08a" letter-spacing="3">
    BLOCK N SHOP 89, 90, 91, 92
  </text>
  <text x="500" y="145" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#ffffff" opacity="0.9">
    EBUTE-ERO MARKET GORODOM, IDUMOTA, LAGOS ISLAND
  </text>

  <!-- Shutter Frame & Glass Front -->
  <rect x="50" y="200" width="900" height="950" fill="#1e293b" stroke="#cbd5e1" stroke-width="8"/>

  <!-- Interior Bright Light Glow -->
  <rect x="70" y="220" width="860" height="910" fill="#fffbebe6"/>

  <!-- Sky Printed Ceiling Light Panel -->
  <polygon points="120,240 880,240 820,320 180,320" fill="url(#skyCeiling)"/>
  <!-- Clouds on sky ceiling -->
  <ellipse cx="300" cy="270" rx="60" ry="20" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="600" cy="280" rx="90" ry="25" fill="#ffffff" opacity="0.85"/>

  <!-- Display Shelves with Gold Chafing Dishes -->
  <!-- Shelf 1 -->
  <line x1="100" y1="420" x2="900" y2="420" stroke="#d4af37" stroke-width="10"/>
  <!-- Chafing Dishes on Shelf 1 -->
  <g transform="translate(180, 360)">
    <rect x="-60" y="-30" width="120" height="50" rx="10" fill="url(#goldChafe)"/>
    <ellipse cx="0" cy="-30" rx="60" ry="20" fill="#fef08a"/>
    <circle cx="0" cy="-45" r="8" fill="#ca8a04"/>
  </g>
  <g transform="translate(500, 360)">
    <rect x="-80" y="-35" width="160" height="55" rx="12" fill="url(#goldChafe)"/>
    <ellipse cx="0" cy="-35" rx="80" ry="25" fill="#fef08a"/>
    <circle cx="0" cy="-52" r="10" fill="#ca8a04"/>
  </g>
  <g transform="translate(820, 360)">
    <rect x="-60" y="-30" width="120" height="50" rx="10" fill="url(#goldChafe)"/>
    <ellipse cx="0" cy="-30" rx="60" ry="20" fill="#fef08a"/>
    <circle cx="0" cy="-45" r="8" fill="#ca8a04"/>
  </g>

  <!-- Shelf 2 -->
  <line x1="100" y1="620" x2="900" y2="620" stroke="#d4af37" stroke-width="10"/>
  <!-- Dubai Food Warmers on Shelf 2 -->
  <g transform="translate(250, 550)">
    <circle cx="0" cy="0" r="50" fill="url(#goldChafe)"/>
    <circle cx="0" cy="-25" r="45" fill="#ffffff" stroke="#d4af37" stroke-width="4"/>
  </g>
  <g transform="translate(720, 550)">
    <circle cx="0" cy="0" r="50" fill="url(#goldChafe)"/>
    <circle cx="0" cy="-25" r="45" fill="#ffffff" stroke="#d4af37" stroke-width="4"/>
  </g>

  <!-- Ground Tier Displays -->
  <!-- Red Chair with Do Not Sit Sign -->
  <rect x="250" y="800" width="140" height="180" rx="12" fill="#dc2626"/>
  <rect x="260" y="880" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="320" y="905" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#dc2626">
    DO NOT SIT HERE
  </text>

  <!-- Glass Front Door Panel Overlays -->
  <rect x="50" y="200" width="900" height="950" fill="url(#glassGlare)"/>

  <!-- Glass Caution Stickers -->
  <g transform="translate(180, 580)">
    <rect x="0" y="0" width="100" height="30" fill="#dc2626" rx="4"/>
    <text x="50" y="20" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#ffffff">
      PUSH
    </text>
  </g>
  <g transform="translate(430, 580)">
    <rect x="0" y="0" width="140" height="30" fill="#ffffff" stroke="#dc2626" stroke-width="3" rx="4"/>
    <text x="70" y="20" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="12" fill="#dc2626">
      MIND THE GLASS
    </text>
  </g>

  <!-- Location Overlay Tag -->
  <g transform="translate(500, 1120)">
    <rect x="-250" y="-25" width="500" height="40" rx="20" fill="#020617"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#38bdf8">
      📍 ROZAY KITCHEN SHOWROOM STOREFRONT
    </text>
  </g>
</svg>
