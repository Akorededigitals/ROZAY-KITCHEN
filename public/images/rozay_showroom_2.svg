<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="goldPure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1200" fill="url(#bgGlow)"/>

  <!-- Glass Sky Ceiling -->
  <rect x="100" y="50" width="800" height="180" rx="16" fill="#0284c7" stroke="#e0f2fe" stroke-width="8"/>
  <ellipse cx="400" cy="140" rx="120" ry="40" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="650" cy="130" rx="100" ry="35" fill="#ffffff" opacity="0.85"/>

  <!-- Gold Birdcage Display Structure -->
  <g transform="translate(700, 700)">
    <path d="M -150,200 C -150,-100 150,-100 150,200 Z" fill="none" stroke="url(#goldPure)" stroke-width="12"/>
    <line x1="-100" y1="200" x2="-100" y2="-20" stroke="url(#goldPure)" stroke-width="6"/>
    <line x1="-50" y1="200" x2="-50" y2="-60" stroke="url(#goldPure)" stroke-width="6"/>
    <line x1="0" y1="200" x2="0" y2="-80" stroke="url(#goldPure)" stroke-width="6"/>
    <line x1="50" y1="200" x2="50" y2="-60" stroke="url(#goldPure)" stroke-width="6"/>
    <line x1="100" y1="200" x2="100" y2="-20" stroke="url(#goldPure)" stroke-width="6"/>
    <!-- Gold Flower Ornament on Top -->
    <circle cx="0" cy="-100" r="20" fill="url(#goldPure)"/>
  </g>

  <!-- Gold Chafing Dishes & Food Warmers Display -->
  <g transform="translate(350, 650)">
    <!-- Main Chafing Dish -->
    <rect x="-180" y="-80" width="360" height="160" rx="20" fill="url(#goldPure)"/>
    <ellipse cx="0" cy="-80" rx="180" ry="60" fill="#fef08a" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="0" cy="-130" r="22" fill="url(#goldPure)"/>
  </g>

  <!-- Dubai Warmers Stack -->
  <g transform="translate(350, 950)">
    <ellipse cx="0" cy="0" rx="200" ry="50" fill="url(#goldPure)"/>
    <ellipse cx="0" cy="-40" rx="160" ry="40" fill="#ffffff" stroke="#ca8a04" stroke-width="6"/>
  </g>

  <!-- Overlay Tag -->
  <g transform="translate(500, 1120)">
    <rect x="-300" y="-25" width="600" height="40" rx="20" fill="#0f172a"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#fef08a">
      ✨ LUXURY GOLD CHAFING DISHES &amp; DUBAI FOOD WARMERS
    </text>
  </g>
</svg>
